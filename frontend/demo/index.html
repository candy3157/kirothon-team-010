<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<title>Moviepato — 지금 출발해서 볼 수 있는 영화관</title>
<style>
  :root{
    --bg:#0b0b0b; --surface:#151515; --surface2:#1e1e1e; --line:#2d2d2d;
    --text:#f3f3f3; --sub:#a3a3a3; --mute:#6e6e6e;
    --accent:#e11d2e; --accent-ink:#ffffff; --ok:#f3f3f3; --warn:#ff7a85; --bad:#ff4d5a; --info:#8c8c8c;
    --radius:16px; --shadow:0 10px 30px rgba(0,0,0,.35);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
  button{font:inherit;color:inherit;cursor:pointer}
  input,select{font:inherit;color:inherit}
  .i{width:1.2em;height:1.2em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em;flex:none}
  .btn,.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .pick{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .screen{display:none;min-height:100%}
  .screen.active{display:flex;flex-direction:column}
  .wrap{width:100%;max-width:560px;margin:0 auto;padding:20px 18px 120px}

  /* ---------- common ---------- */
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px}
  .brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff}
  .steps{display:flex;gap:6px;margin:14px 0 4px}
  .steps i{flex:1;height:4px;border-radius:4px;background:var(--line)}
  .steps i.on{background:var(--accent)}
  h1{font-size:24px;line-height:1.3;margin:14px 0 6px}
  .lead{color:var(--sub);margin:0 0 18px;font-size:14px}
  .label{font-size:13px;color:var(--sub);margin:22px 0 8px;font-weight:600}
  .chip{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
  .btn{border:0;border-radius:14px;padding:15px 18px;font-weight:700;font-size:16px;background:var(--surface2)}
  .btn.primary{background:var(--accent);color:var(--accent-ink)}
  .btn.primary:disabled{opacity:.35;cursor:not-allowed}
  .btn.ghost{background:transparent;border:1px solid var(--line)}
  .btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
  .cta-bar{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);z-index:20}
  .cta-bar .inner{max-width:560px;margin:0 auto;display:flex;gap:10px}
  .cta-bar .btn{flex:1}
  .field{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .field input{flex:1;background:transparent;border:0;outline:none;font-size:15px;min-width:0}
  .notice{font-size:13px;border-radius:12px;padding:10px 12px;margin-top:10px;background:var(--surface2);color:var(--sub)}
  .notice.warn{background:rgba(225,29,46,.12);color:var(--warn)}
  .notice.bad{background:rgba(225,29,46,.12);color:var(--bad)}
  .notice.ok{background:rgba(255,255,255,.12);color:var(--ok)}

  /* ---------- S01 movies ---------- */
  .tabs{display:flex;gap:8px;margin:16px 0 4px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
  @media (min-width:480px){.grid{grid-template-columns:repeat(4,1fr)}}
  .movie{background:none;border:0;padding:0;text-align:left}
  .poster{aspect-ratio:2/3;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px;font-weight:800;font-size:15px;line-height:1.2;box-shadow:var(--shadow);border:2px solid transparent;transition:transform .15s}
  .movie:hover .poster{transform:translateY(-2px)}
  .movie[aria-pressed="true"] .poster{border-color:var(--accent)}
    .ptitle{display:block;text-shadow:0 2px 8px #000}
  .ptitle small{display:block;font-size:10px;font-weight:500;opacity:.8;margin-top:3px;letter-spacing:.04em}
  .age{position:absolute;top:8px;left:8px;font-size:11px;padding:2px 6px;border-radius:6px;background:rgba(0,0,0,.45)}
  .mt{margin-top:6px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ms{font-size:11px;color:var(--sub)}
  .empty{text-align:center;color:var(--sub);padding:40px 10px}
  .empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}

  /* ---------- S02 ---------- */
  .picked{display:flex;gap:12px;align-items:center;background:var(--surface);border-radius:var(--radius);padding:12px}
  .picked .poster{width:52px;aspect-ratio:2/3;padding:0;font-size:0;box-shadow:none;border-radius:8px}
  .picked .info{flex:1}
  .picked .t{font-weight:700}
  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .seg button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:14px}
  .seg button .i{width:30px;height:30px;stroke-width:1.6}
  .seg button[aria-pressed="true"]{border-color:var(--accent);background:rgba(225,29,46,.12);color:var(--accent);font-weight:700}
  .origin-row{display:flex;gap:8px}
  .origin-row .btn{white-space:nowrap}
  .suggest{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden}
  .suggest button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
  .suggest button:last-child{border-bottom:0}
  .suggest button:hover{background:var(--surface2)}
  .origin-set{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px;color:var(--ok)}
  details{background:var(--surface);border-radius:14px;padding:4px 14px;margin-top:22px}
  summary{padding:10px 0;font-size:14px;color:var(--sub);cursor:pointer}
  .opt-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
  .stepper{display:flex;align-items:center;gap:10px}
  .stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface2)}
  input[type="datetime-local"]{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;width:100%;color-scheme:dark}

  /* ---------- S03 map ---------- */
  #s03.active{height:100dvh;overflow:hidden;position:relative}
  .topbar{position:absolute;top:0;left:0;right:0;z-index:15;padding:10px 12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .topbar > *{pointer-events:auto}
  .summary{display:flex;align-items:center;gap:10px;background:rgba(16,16,16,.94);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
  .summary .back{background:none;border:0;padding:0;display:grid;place-items:center}
  .summary .s-main{flex:1;min-width:0}
  .summary .s-title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .summary .s-sub{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sortbar{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
  .sortbar .chip{box-shadow:var(--shadow);background:rgba(16,16,16,.94)}
  .sortbar .chip[aria-pressed="true"]{background:var(--accent)}

  .map{position:absolute;inset:0;background:#101010;overflow:hidden;touch-action:none;cursor:grab}
  .map.dragging{cursor:grabbing}
  .world{position:absolute;left:50%;top:50%;width:0;height:0;will-change:transform;transition:transform .35s ease}
  .map.dragging .world{transition:none}
  .world svg.bg{position:absolute;left:-2000px;top:-2000px;width:4000px;height:4000px}
  .radius{position:absolute;border:1.5px dashed rgba(225,29,46,.35);border-radius:50%;background:rgba(225,29,46,.04);pointer-events:none}
  .me{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#fff;border:4px solid var(--accent);box-shadow:0 0 0 8px rgba(255,255,255,.25)}
  .me-label{position:absolute;transform:translate(-50%,14px);font-size:11px;background:#fff;color:#123;padding:2px 6px;border-radius:6px;white-space:nowrap;font-weight:700}
  .pin{position:absolute;transform:translate(-50%,-100%);background:var(--surface);border:2px solid var(--accent);color:var(--text);border-radius:12px;padding:4px 8px 4px 4px;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap;box-shadow:var(--shadow);transition:transform .15s}
  .pin::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--accent);border-bottom:0}
  .pin .rk{width:22px;height:22px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
  .pin.top{z-index:3}
  .pin.sel{transform:translate(-50%,-100%) scale(1.15);z-index:5;background:var(--accent);color:var(--accent-ink)}
  .pin.sel .rk{background:var(--accent-ink);color:var(--accent)}
  .pin.unk{border-color:var(--mute);color:var(--sub)}
  .pin.unk::after{border-top-color:var(--mute)}
  .pin.unk .rk{background:var(--mute);color:#fff}
  .map-tools{position:absolute;right:12px;z-index:12;display:flex;flex-direction:column;gap:6px}
  .map-tools button{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:18px;box-shadow:var(--shadow)}
  .research{position:absolute;left:50%;transform:translateX(-50%);z-index:12;display:none}
  .research.show{display:block}
  .research button{background:var(--accent);color:#fff;display:flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:9px 16px;font-weight:700;font-size:13px;box-shadow:var(--shadow)}

  /* sheet / side panel */
  .sheet{position:absolute;left:0;right:0;bottom:0;z-index:14;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.4);display:flex;flex-direction:column;height:46%;transition:height .3s ease}
  .sheet.expanded{height:86%}
  .sheet.peek{height:120px}
  .handle{background:none;border:0;padding:10px 0 4px;width:100%;display:grid;place-items:center}
  .handle i{width:40px;height:5px;border-radius:5px;background:var(--line);display:block}
  .sheet-head{padding:4px 16px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .sheet-head h2{font-size:17px;margin:0}
  .sheet-head .meta{font-size:12px;color:var(--mute)}
  .sheet-body{overflow-y:auto;padding:0 12px 24px;flex:1}
  @media (min-width:900px){
    .sheet,.sheet.expanded,.sheet.peek{left:auto;top:0;width:400px;height:100%;border-radius:0;border-left:1px solid var(--line)}
    .handle{display:none}
    .map{right:400px}
    .topbar{right:400px}
    .map-tools{right:412px!important}
  }

  .card{width:100%;text-align:left;background:var(--surface2);border:2px solid transparent;border-radius:14px;padding:14px;margin-bottom:10px;display:block}
  .card.sel{border-color:var(--accent)}
  .card .row1{display:flex;align-items:center;gap:10px}
  .rank{width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;flex:none}
  .rank.unk{background:var(--mute);color:#fff}
  .card .nm{font-weight:700;flex:1;min-width:0}
  .card .nm small{display:block;color:var(--sub);font-weight:500;font-size:12px}
  .start{text-align:right}
  .start b{font-size:20px;display:block;line-height:1}
  .start small{font-size:11px;color:var(--sub)}
  .timeline{display:flex;align-items:center;margin:14px 2px 6px;font-size:11px;color:var(--sub)}
  .timeline .seg-bar{flex:1;height:6px;border-radius:6px;position:relative;background:var(--line);overflow:hidden;margin:0 6px}
  .timeline .seg-bar i{position:absolute;top:0;bottom:0;border-radius:6px}
  .stats{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .tag{font-size:12px;padding:4px 8px;border-radius:8px;background:var(--surface);color:var(--sub)}
  .tag.ok{color:var(--ok);background:rgba(255,255,255,.1)}
  .tag.warn{color:var(--warn);background:rgba(225,29,46,.1)}
  .tag.acc{color:var(--accent);background:rgba(225,29,46,.12);font-weight:700}
  .section-t{font-size:12px;color:var(--mute);margin:16px 4px 8px;font-weight:700}

  .skel{background:var(--surface2);border-radius:14px;height:112px;margin-bottom:10px;position:relative;overflow:hidden}
  .skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);animation:sh 1.2s infinite}
  @keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .loading-pill{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:13;background:var(--surface);border:1px solid var(--line);padding:10px 16px;border-radius:999px;font-size:13px;display:none;box-shadow:var(--shadow)}
  .loading-pill.show{display:block}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin-right:6px;vertical-align:-1px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* S04 detail */
  .detail-head{display:flex;align-items:flex-start;gap:10px;padding:4px 4px 12px}
  .detail-head .back{background:var(--surface2);border:0;border-radius:10px;width:34px;height:34px;flex:none;display:grid;place-items:center}
  .detail-head h3{margin:0;font-size:18px}
  .detail-head p{margin:2px 0 0;color:var(--sub);font-size:12px}
  .travel-box{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
  .travel-box div{background:var(--surface2);border-radius:12px;padding:10px;text-align:center}
  .travel-box small{display:block;color:var(--sub);font-size:11px}
  .travel-box b{font-size:16px}
  .shows{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .showtime{border:1.5px solid var(--line);background:var(--surface2);border-radius:12px;padding:10px;text-align:left}
  .showtime b{font-size:18px}
  .showtime .f{font-size:11px;color:var(--sub)}
  .showtime .why{font-size:11px;margin-top:4px}
  .showtime[aria-pressed="true"]{border-color:var(--accent);background:rgba(225,29,46,.12)}
  .showtime:disabled{opacity:.45;cursor:not-allowed}
  .showtime:disabled .why{color:var(--bad)}
  .pick-sum{background:rgba(225,29,46,.1);border:1px solid rgba(225,29,46,.3);border-radius:12px;padding:12px;margin-top:12px;font-size:14px}
  .detail-cta{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 0 4px;background:linear-gradient(transparent,var(--surface) 25%)}
  .detail-cta .btn{flex:1}

  /* modal + toast + demo panel */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
  .modal.show{display:flex}
  .modal .box{background:var(--surface);width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px}
  @media (min-width:600px){.modal{align-items:center}.modal .box{border-radius:20px}}
  .modal h4{margin:0 0 8px;font-size:17px}
  .modal p{color:var(--sub);font-size:14px;margin:0 0 16px;line-height:1.5}
  .modal .acts{display:flex;gap:8px}.modal .acts .btn{flex:1}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);opacity:0;background:#fff;color:#123;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;transition:.25s;pointer-events:none;font-weight:600}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .demo{position:fixed;right:10px;top:50%;z-index:40;font-size:12px}
  .demo summary{display:flex;align-items:center;gap:6px;background:#000a;border:1px dashed var(--accent);color:var(--accent);padding:6px 10px;border-radius:10px;list-style:none}
  .demo[open] summary{border-radius:10px 10px 0 0}
  .demo .pane{background:#000d;border:1px dashed var(--accent);border-top:0;padding:10px;border-radius:0 0 10px 10px;width:220px}
  .demo select{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px;margin-top:4px}
  .demo details{margin:0;padding:0;background:none}

  /* =========================================================
     REFINED THEME — 그라데이션·그림자·알약 모양 제거, 선과 글자로 정리
     ========================================================= */
  :root{--radius:6px; font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif; letter-spacing:-.01em}
  body{-webkit-font-smoothing:antialiased}
  h1{font-size:30px;font-weight:700;letter-spacing:-.035em;line-height:1.2;margin:28px 0 8px}
  .lead{font-size:14px;color:var(--sub);line-height:1.6}
  .brand{font-size:15px;font-weight:700;letter-spacing:-.02em}
  .brand .logo{width:auto;height:auto;background:none;color:var(--accent)}
  .steps{gap:4px;margin-top:20px}.steps i{height:2px;border-radius:0}
  .label{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--mute);margin:30px 0 10px}

  /* 버튼 · 칩: 각진 모양, 그림자 없음 */
  .btn{border-radius:4px;font-weight:600;letter-spacing:-.01em}
  .btn.ghost{border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--sub)}
  .chip{border-radius:4px;background:transparent;font-weight:500}
  .chip[aria-pressed="true"]{background:var(--text);color:#000;border-color:var(--text);font-weight:600}
  .cta-bar{background:var(--bg);border-top:1px solid var(--line)}
  .field{border-radius:4px;background:transparent}
  .field:focus-within{border-color:var(--sub)}
  .notice{border-radius:0;background:transparent!important;border-left:2px solid var(--line);padding:6px 12px}
  .notice.warn,.notice.bad{border-left-color:var(--accent)}

  /* S01 탭: 밑줄형 */
  .tabs{gap:20px;border-bottom:1px solid var(--line);margin-top:24px}
  .tabs .chip{border:0;padding:10px 0;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--mute);background:none}
  .tabs .chip[aria-pressed="true"]{color:var(--text);background:none;border-bottom-color:var(--accent)}
  .grid{gap:18px 12px;margin-top:20px}
  .poster{border-radius:3px;box-shadow:none;border:0;outline:2px solid transparent;outline-offset:2px;transition:outline-color .15s, opacity .15s}
  .movie:hover .poster{transform:none;opacity:.85}
  .movie[aria-pressed="true"] .poster{outline-color:var(--accent)}
  .age{border-radius:2px;background:#000;font-weight:600;font-size:10px}
  .pick{border-radius:2px;width:22px;height:22px}
  .mt{margin-top:10px;font-size:14px;font-weight:600}
  .ms{color:var(--mute)}

  /* S02 */
  .picked{background:none;border:1px solid var(--line);border-radius:4px}
  .picked .poster{border-radius:2px}
  .seg{gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .seg button{border:0;border-right:1px solid var(--line);border-radius:0;background:none;color:var(--mute);padding:16px 6px}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--surface2);color:var(--text);box-shadow:inset 0 -2px 0 var(--accent)}
  .suggest{border-radius:4px}
  details{background:none;border:1px solid var(--line);border-radius:4px}
  .stepper button{border-radius:3px;background:none}
  input[type="datetime-local"]{border-radius:4px;background:none}

  /* S03 지도 위 UI */
  .summary,.sortbar .chip,.map-tools button{box-shadow:none;backdrop-filter:none}
  .summary{border-radius:6px;background:#0b0b0b}
  .sortbar{gap:0;align-self:flex-start;border:1px solid var(--line);border-radius:4px;background:#0b0b0b;overflow:hidden}
  .sortbar .chip{border:0;border-right:1px solid var(--line);border-radius:0;background:transparent;color:var(--mute)}
  .sortbar .chip:last-child{border-right:0}
  .sortbar .chip[aria-pressed="true"]{background:var(--text);color:#000}
  .map-tools button{border-radius:4px;background:#0b0b0b}
  .research button{border-radius:4px;box-shadow:none;background:rgba(225,29,46,.55);border:0;outline:0;
                   -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff}
  .research button:hover{background:rgba(225,29,46,.75)}
  /* 회색 테두리 완전 제거 (브라우저 기본 버튼 모양 · 포커스 링 포함) */
  .research button,.research button:focus,.research button:focus-visible,.research button:active{
    -webkit-appearance:none;appearance:none;border:none!important;outline:none!important;box-shadow:none!important}
  .radius{border:1px solid rgba(225,29,46,.4);background:none}
  .pin{border-radius:3px;border:1px solid #000;background:#fff;color:#000;box-shadow:0 1px 0 rgba(0,0,0,.4);padding:3px 7px 3px 3px;font-variant-numeric:tabular-nums}
  .pin::after{border-top-color:#fff}
  .pin .rk{border-radius:2px;width:auto;padding:0 4px;height:20px;background:#000;color:#fff;font-size:11px}
  .pin.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  .pin.sel::after{border-top-color:var(--accent)}
  .pin.sel .rk{background:#000;color:#fff}
  .pin.unk{background:#2a2a2a;border-color:#2a2a2a;color:var(--sub)}
  .pin.unk::after{border-top-color:#2a2a2a}
  .loading-pill{border-radius:4px;box-shadow:none}
  .sheet{border-radius:10px 10px 0 0;background:var(--bg);box-shadow:none;border-top:1px solid var(--line)}
  .sheet-head{border-bottom:1px solid var(--line);padding-bottom:12px}
  .sheet-head h2{font-size:15px;font-weight:600}
  .sheet-body{padding:0 16px 24px}

  /* 결과: 박스 카드 → 줄 목록 */
  .card{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:18px 0;margin:0;position:relative}
  .card:hover{background:rgba(255,255,255,.02)}
  .card.sel{border-bottom-color:var(--line);box-shadow:inset 3px 0 0 var(--accent);padding-left:12px}
  .rank{width:auto;height:auto;background:none;color:var(--accent);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;align-self:flex-start;margin-top:2px}
  .rank.unk{background:none;color:var(--mute)}
  .card .nm{font-size:15px;font-weight:600}
  .card .nm small{color:var(--mute);margin-top:2px}
  .start b{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .start small{color:var(--mute);font-size:10px;letter-spacing:.08em}
  .timeline{margin:14px 0 10px;font-variant-numeric:tabular-nums;color:var(--mute)}
  .timeline .seg-bar{height:2px;border-radius:0}
  .timeline .seg-bar i{border-radius:0}
  .timeline .seg-bar i:first-child{background:var(--sub)!important}
  .stats{gap:0;margin-top:0;font-size:12px}
  .tag{background:none!important;padding:0;border-radius:0;color:var(--sub);font-size:12px}
  .tag + .tag::before{content:"·";margin:0 7px;color:var(--mute)}
  .tag.acc{color:var(--accent);font-weight:600}
  .tag.ok{color:var(--text)}
  .tag.warn{color:var(--warn)}
  .tag .i{width:1em;height:1em;vertical-align:-.12em}
  .section-t{font-size:11px;letter-spacing:.12em;margin:28px 0 4px}
  .skel{border-radius:2px;height:96px;background:var(--surface)}

  /* S04 상세 */
  .detail-head{padding:16px 0 14px}
  .detail-head .back{background:none;border:1px solid var(--line);border-radius:4px}
  .detail-head h3{font-size:20px;font-weight:700;letter-spacing:-.02em}
  .travel-box{gap:0;border:1px solid var(--line);border-radius:4px}
  .travel-box div{background:none;border-radius:0;border-right:1px solid var(--line);padding:12px 8px}
  .travel-box div:last-child{border-right:0}
  .travel-box b{font-weight:600;font-variant-numeric:tabular-nums}
  .shows{gap:6px}
  .showtime{border-radius:4px;background:none;border:1px solid var(--line)}
  .showtime b{font-weight:600;font-variant-numeric:tabular-nums}
  .showtime[aria-pressed="true"]{border-color:var(--accent);background:rgba(225,29,46,.08)}
  .pick-sum{border-radius:0;background:none;border:0;border-left:2px solid var(--accent);padding:4px 12px;line-height:1.7}
  .detail-cta{background:var(--bg);border-top:1px solid var(--line);margin-top:8px}

  .modal .box{border-radius:8px;border:1px solid var(--line);background:var(--bg)}
  .toast{border-radius:4px}
  .demo summary,.demo .pane{border-radius:4px!important}
  @media (min-width:900px){ .sheet,.sheet.expanded,.sheet.peek{border-radius:0;border-top:0} }

  /* =========================================================
     v4 — 시작 화면 + 선택 상태 빨강 + 정보 밀도 복원
     ========================================================= */
  #s00 .hero{position:relative;min-height:88vh;display:flex;overflow:hidden;border-bottom:1px solid var(--line)}
  .wall{position:absolute;inset:-15%;display:grid;grid-template-columns:repeat(6,1fr);gap:10px;transform:rotate(-8deg);opacity:.55}
  .wall i{aspect-ratio:2/3;background:#1a1a1a center/cover;border-radius:2px;filter:grayscale(.6) contrast(1.05)}
  .wall i:nth-child(5n+2){filter:none}
  .hero::after{content:"";position:absolute;inset:0;background:rgba(11,11,11,.72)}
  .hero-inner{position:relative;z-index:1;width:100%;max-width:1080px;margin:0 auto;padding:22px 24px 48px;display:flex;flex-direction:column}
  .lnav{display:flex;justify-content:space-between;align-items:center}
  .wordmark{font-size:22px;font-weight:800;letter-spacing:-.05em}
  .wordmark b{color:var(--accent)}
  .hero-copy{margin-top:auto;max-width:620px}
  .eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 14px}
  #s00 h1{font-size:clamp(34px,7vw,60px);line-height:1.12;letter-spacing:-.045em;margin:0 0 18px;font-weight:800}
  #s00 h1 em{font-style:normal;color:var(--accent)}
  .hero-sub{color:#cfcfcf;font-size:16px;line-height:1.65;margin:0 0 28px}
  .hero-cta{display:flex;gap:10px;flex-wrap:wrap}
  .btn.lg{padding:16px 26px;font-size:16px;text-decoration:none}
  .btn.block{width:100%;display:flex}
  .lwrap{max-width:1080px;margin:0 auto;padding:48px 24px 40px}
  .sample{border:1px solid var(--line);border-radius:6px;padding:18px 20px;background:var(--surface);max-width:520px}
  .sample-top{font-size:12px;color:var(--mute);margin-bottom:14px;display:flex;gap:8px;align-items:center}
  .sample-top span{color:var(--accent);border:1px solid var(--accent);padding:1px 6px;border-radius:2px;font-size:10px;letter-spacing:.08em}
  .sample-row{display:flex;align-items:center;gap:12px}
  .sample-row .nm{flex:1;font-weight:600}.sample-row .nm small{display:block;font-weight:400;color:var(--mute);font-size:12px;margin-top:2px}
  .sample-bar{display:flex;gap:3px;margin:16px 0 8px}.sample-bar i{height:3px;background:var(--sub)}.sample-bar i+i{background:var(--accent)}
  .sample-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
  .how{margin:64px 0 0}
  .how h2{font-size:26px;margin:0 0 24px;letter-spacing:-.03em}
  .how ol{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));border-top:1px solid var(--line)}
  .how li{padding:20px 18px 22px 0;border-bottom:1px solid var(--line)}
  .how li span{color:var(--accent);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
  .how li b{display:block;font-size:17px;margin:10px 0 6px}
  .how li p,.promise p{margin:0;color:var(--sub);font-size:14px;line-height:1.6}
  .promise{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:48px 0}
  .promise div{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px}
  .promise b{display:block;font-size:16px;margin-bottom:6px;letter-spacing:-.03em}
  .lfoot{color:var(--mute);font-size:12px;text-align:center;margin-top:28px}

  /* 흐름 화면: 상단 바 제거 후 여백 */
  #s01 .wrap,#s02 .wrap{padding-top:28px}
  .steps{margin-top:0}

  /* 선택 상태 = 빨강 */
  .seg{gap:8px;border:0;overflow:visible}
  .seg button{border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--sub);transition:background .15s,border-color .15s,color .15s}
  .seg button:last-child{border-right:1px solid var(--line)}
  .seg button:hover{border-color:#555;color:var(--text)}
  .seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:none}
  .chip{transition:background .15s,border-color .15s}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .tabs .chip[aria-pressed="true"]{background:none;color:var(--text)}
  .sortbar .chip[aria-pressed="true"]{background:var(--accent);color:#fff}
  .showtime[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .showtime[aria-pressed="true"] .f,.showtime[aria-pressed="true"] .why span{color:#fff!important}

  /* 결과 카드: 정보 밀도 복원 (면 + 칩) */
  .sheet-body{padding:12px 12px 24px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:8px}
  .card:hover{background:#181818;border-color:#3a3a3a}
  .card.sel{border-color:var(--accent);box-shadow:none;padding-left:16px}
  .stats{gap:6px;margin-top:4px}
  .tag{border:1px solid var(--line);padding:3px 8px;border-radius:3px}
  .tag + .tag::before{content:none}
  .tag.acc{border-color:rgba(225,29,46,.5);background:rgba(225,29,46,.1)!important}
  .tag.warn{border-color:rgba(255,122,133,.35)}
  .nm-line{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
  .badge{font-size:10px;font-weight:600;color:#fff;background:var(--accent);padding:2px 6px;border-radius:3px;letter-spacing:0}
  .lwrap{padding-bottom:64px}
  .opt-box{border:1px solid var(--line);border-radius:4px;padding:4px 14px;margin-top:22px}
  .opt-box .opt-row{border-top:0}
  .btn.soft-red{background:#4a1219;color:#ffd9dc;border:1px solid #6b1c25}
  .btn.soft-red:hover{background:#5a1620}

  /* 시작 화면: 섹션 단위로 한 화면씩 넘기기 + 나타나기 애니메이션 */
  #s00 .hero{min-height:100vh;min-height:100dvh}
  #s00 .lwrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding-top:40px;padding-bottom:40px}
  #s00 .how{margin:0}
  .hero-main{margin-top:auto;display:grid;grid-template-columns:1fr;gap:20px;align-items:end}
  .hero-art{order:-1;display:flex;justify-content:center}
  .hero-art svg{width:100%;max-width:440px;height:auto}
  @media (min-width:900px){
    .hero-main{margin:auto 0;grid-template-columns:1fr 1fr;align-items:center;gap:40px}
    .hero-art{order:2}
    .hero-art svg{max-width:520px}
  }
  @media (max-height:700px) and (max-width:899px){ .hero-art svg{max-width:300px} }
  .lcta{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:40px 24px;text-align:center;border-top:1px solid var(--line)}
  .lcta p{margin:0;font-size:clamp(24px,4vw,36px);font-weight:700;letter-spacing:-.035em}
  .lcta .btn{min-width:220px}
  .reveal{opacity:0;transform:translateY(28px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0ms)}
  .reveal.in{opacity:1;transform:none}
  @media (prefers-reduced-motion:reduce){
    .reveal{opacity:1;transform:none;transition:none}
  }

  /* 상영회차: 가로로 넘기는 둥근 네모 카드 (버튼과 구분) */
  .shows-t{border-top:1px solid var(--line);padding-top:18px;margin-top:20px}
  .shows{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px 0 0;padding:2px 16px 6px 0;scrollbar-width:none}
  .shows::-webkit-scrollbar{display:none}
  .showtime{flex:0 0 auto;scroll-snap-align:start;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);
        display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 14px;text-align:center}
  .showtime b{font-size:18px;font-weight:600}
  .showtime .f{font-size:11px}
  .showtime .why{font-size:11px;margin-top:4px;white-space:nowrap}
  .showtime:not(:disabled):hover{border-color:#555}
  .showtime[aria-pressed="true"]{background:var(--surface);border:2px solid var(--accent);color:var(--text)}
  .showtime[aria-pressed="true"] b{color:var(--accent)}
  .showtime[aria-pressed="true"] .f{color:var(--sub)!important}
  .showtime[aria-pressed="true"] .why span{color:var(--text)!important}

  /* 카드 시간 막대: 출발 ━(이동, 빨강)━|━(대기)━ 상영 */
  .tl{margin-top:14px}
  .tl-bar{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums}
  .tl-track{flex:1;height:3px;background:#3a3a3a;position:relative}
  .tl-go{position:absolute;left:0;top:0;bottom:0;background:var(--accent)}
  .tl-mark{position:absolute;top:-4px;width:2px;height:11px;margin-left:-1px;background:var(--text)}
  .tl-tags{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:0 42px 0 42px}
  .tag.travel{color:var(--accent);border-color:rgba(225,29,46,.55);background:rgba(225,29,46,.1)!important;font-weight:600}

  /* 스플래시 */
  .splash{height:100vh;height:100dvh;align-items:center;justify-content:center;background:var(--bg);cursor:pointer;transition:opacity .6s ease}
  .splash.out{opacity:0}
  .splash-inner{text-align:center}
  .splash-logo{font-size:clamp(44px,9vw,84px);font-weight:800;letter-spacing:-.055em;opacity:0;transform:translateY(12px);animation:spIn .6s .1s cubic-bezier(.2,.7,.2,1) forwards}
  .splash-logo b{color:var(--accent)}
  .splash-slogan{margin:14px 0 0;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--sub);opacity:0;animation:spIn .6s .35s ease forwards}
  @keyframes spIn{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){ .splash-logo,.splash-slogan{animation:none;opacity:1;transform:none} .splash{transition:none} }
</style>
</head>

];
const PLACES = [
  {label:'강남역 2호선', lat:37.4979, lng:127.0276},
  {label:'서울특별시청', lat:37.5663, lng:126.9779},

];

/* =====================================================================
   STATE  (명세서 6장 SearchContext)
   ===================================================================== */
const ctx = {
  selectedMovieId:null, origin:null, transportMode:'transit', departureAt:'now',
  arrivalBufferMinutes:10, radiusKm:10, sortMode:'earliest',
  selectedTheaterId:null, selectedShowtimeId:null,
};
const ui = { tab:'now', q:'', results:null, fetchedAt:null, pan:{x:0,y:0}, zoom:1, sheet:'mid', dirty:true };
const ENTRY_MIN = 5;      // 입장 소요 시간
const PREP_MIN = 0;       // 출발 준비 시간 (MVP)

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const I = n => `<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2,'0');
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const addMin = (d,m) => new Date(d.getTime()+m*60000);
const diffMin = (a,b) => Math.round((a-b)/60000);
const hash = s => { let h=2166136261; for (const c of s) { h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; };
const MODE = {transit:{ic:'train',nm:'대중교통'}, driving:{ic:'car',nm:'자동차'}, walking:{ic:'walk',nm:'도보'}};
const SORT = {earliest:'가장 빨리 보기', shortest_travel:'최단 이동', relaxed:'여유 있게 도착'};
function km(a,b){ const R=6371, dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
  const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(x)); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
function announce(msg){ $('#live').textContent=msg; }
function go(id){ $$('.screen').forEach(s=>s.classList.toggle('active', s.id===id)); window.scrollTo(0,0); }
const movie = () => MOVIES.find(m=>m.id===ctx.selectedMovieId);
// 임의 포스터: picsum 랜덤 사진(영화별 고정 seed) + 어두운 그라데이션. 이미지 실패 시 색 그라데이션이 보임
const posterImg = m => `https://picsum.photos/seed/cinema-${m.id}/300/450`;
const posterStyle = m => `background:url(${posterImg(m)}) center/cover,${m.c[0]}`;

/* =====================================================================
   S01 영화 선택
   ===================================================================== */
function renderMovies(){
  const g = $('#movieGrid');
  if ($('#movieFail').checked){
    g.innerHTML = `<div class="empty" style="grid-column:1/-1"><b>영화 정보를 불러오지 못했어요</b>잠시 후 다시 시도해 주세요.<br><br><button class="btn sm primary" onclick="$('#movieFail').checked=false;renderMovies()">다시 시도</button></div>`;
    return;
  }
  const q = ui.q.trim();
  let list = q ? MOVIES.filter(m=>m.title.includes(q)) : MOVIES.filter(m=>m.status===ui.tab);
  if (!list.length){
    g.innerHTML = `<div class="empty" style="grid-column:1/-1"><b>‘${esc(q)}’ 검색 결과가 없습니다</b>띄어쓰기나 철자를 확인하거나 다른 제목으로 검색해 보세요.</div>`;
    return;
  }
  const dupTitles = new Set(MOVIES.map(m=>m.title).filter((t,i,a)=>a.indexOf(t)!==i));
  g.innerHTML = list.map(m=>`
    <button class="movie" data-id="${m.id}" aria-pressed="${ctx.selectedMovieId===m.id}" ${m.status==='soon'?'data-soon="1"':''}
      aria-label="${esc(m.title)} ${m.year}년 ${m.runtime}분${m.status==='soon'?' 상영 예정':''}">
      <div class="poster" style="${posterStyle(m)}"><span class="age">${m.age}</span>${ctx.selectedMovieId===m.id?`<span class="pick">${I('check')}</span>`:''}</div>
      <div class="mt">${esc(m.title)}${dupTitles.has(m.title)?` <span style="color:var(--accent)">(${m.year})</span>`:''}</div>
      <div class="ms">${m.status==='soon'?m.open:`${m.genre} · ${m.runtime}분 · ${m.year}`}</div>
    </button>`).join('');
}
$('#movieGrid').addEventListener('click', e=>{
  const b = e.target.closest('.movie'); if(!b) return;
  if (b.dataset.soon){ toast('아직 개봉 전인 영화예요. 상영 회차가 없어요.'); return; }
  if (ctx.selectedMovieId !== b.dataset.id){ ctx.selectedMovieId = b.dataset.id; ui.dirty = true; }
  renderMovies(); renderS02(); go('s02');
});
$('#q').addEventListener('input', e=>{ ui.q=e.target.value; $('#qClear').hidden=!ui.q; renderMovies(); });
$('#qClear').onclick = ()=>{ ui.q=''; $('#q').value=''; $('#qClear').hidden=true; renderMovies(); $('#q').focus(); };
$$('[data-tab]').forEach(b=>b.onclick=()=>{ ui.tab=b.dataset.tab; $$('[data-tab]').forEach(x=>x.setAttribute('aria-pressed', x===b)); renderMovies(); });
$('#movieFail').onchange = renderMovies;

/* =====================================================================
   S02 출발 조건
   ===================================================================== */
function renderS02(){
  const m = movie(); if(!m) return;
  // 현재 위치를 쓰는 중이면 빨간 버튼, 아니면 기본 버튼
  const usingGeo = ctx.origin?.label==='현재 위치';
  $('#useGeo').classList.toggle('primary', usingGeo);
  $('#useGeo').classList.toggle('ghost', !usingGeo);

/* =====================================================================
   추천 로직 (명세서 4장)
   ===================================================================== */
function travelMinutes(distKm, mode){
  const road = distKm*1.3;
  if (mode==='transit') return Math.round(8 + road/22*60);   // 대기·환승 포함
  if (mode==='driving') return Math.round(4 + road/24*60);   // 시내 평균
  return Math.round(road/4.5*60);
}
function showtimesFor(t, m, base){
  const h = hash(t.id+m.id);
  if (h%6===0) return [];                    // 이 영화관은 해당 영화 미상영
  const offset = 5 + h%50, interval = 25 + (h%4)*15;
  const out=[];
  for (let k=-1;k<9;k++){
    const start = addMin(base, offset + k*interval);
    out.push({ id:`${t.id}-${m.id}-${k}`, start });   // 회차 = 시작 시각만 (관·포맷·좌석은 받아올 수 없어 제외)
  }
  return out;
}
function evaluate(){
  const scenario = $('#scenario').value;
  const now = new Date();
  const dep = ctx.departureAt==='now' ? now : new Date(ctx.departureAt);
  const base = new Date(dep); base.setSeconds(0,0); base.setMinutes(Math.floor(base.getMinutes()/10)*10);
  const m = movie();
  const res = { departAt:dep, scenario, ranked:[], unknown:[], failedProviders:[], noShow:0, inRadius:0 };
  if (scenario==='error') { res.error=true; return res; }

  for (const t of THEATERS){
    const d = km(ctx.origin, t);
    if (scenario==='nearby0' || d > ctx.radiusKm) continue;
    res.inRadius++;
    if (scenario==='partial' && t.brand==='롯데시네마'){ if(!res.failedProviders.includes(t.brand)) res.failedProviders.push(t.brand); continue; }
    let shows = showtimesFor(t, m, base);
    if (!shows.length){ res.noShow++; continue; }
    const routeFail = scenario==='partial' && t.id==='t2';
    const travel = routeFail ? null : travelMinutes(d, ctx.transportMode);
    const entryAt = travel==null ? null : addMin(dep, PREP_MIN + travel + ENTRY_MIN);
    shows = shows.map(s=>{
      if (s.start < now) return {...s, ok:false, why:'이미 시작됨'};
      if (entryAt==null) return {...s, ok:null, why:'도착 시간 확인 불가'};
      const slack = diffMin(s.start, entryAt);
      if (scenario==='none' || slack < ctx.arrivalBufferMinutes)
        return {...s, ok:false, slack, why: slack<0 ? `${-slack}분 늦게 도착` : `여유 ${slack}분 (부족)`};
      return {...s, ok:true, slack};
    });
    const card = { t, dist:d, travel, entryAt, shows, routeFail };
    if (routeFail){ res.unknown.push(card); continue; }
    const okShows = shows.filter(s=>s.ok);
    if (!okShows.length) continue;
    card.earliest = okShows[0];
    card.relaxed = okShows.find(s=>s.slack>=ctx.arrivalBufferMinutes+15) || okShows[0];
    res.ranked.push(card);
  }
  return res;
}
function sorted(res){
  const list = res.ranked.map(c=>({...c, rep: ctx.sortMode==='relaxed' ? c.relaxed : c.earliest}));
  const by = {
    earliest:(a,b)=>a.rep.start-b.rep.start || a.travel-b.travel,
    shortest_travel:(a,b)=>a.travel-b.travel || a.rep.start-b.rep.start,
    relaxed:(a,b)=>a.rep.start-b.rep.start || b.rep.slack-a.rep.slack,
  }[ctx.sortMode];
  list.sort(by);
  // 추천 이유 태그
  const fastest = [...list].sort((a,b)=>a.rep.start-b.rep.start)[0];
  const nearest = [...list].sort((a,b)=>a.travel-b.travel)[0];
  list.forEach(c=>{ c.reasons=[];
    if (c===fastest) c.reasons.push('가장 빠른 관람');
    if (c===nearest) c.reasons.push('가장 가까움');
    if (c.rep.slack>=25) c.reasons.push('여유 있게 도착');
  });
  return list;
}

function pxPerKm(){ const el=$('#map'); const r=Math.min(el.clientWidth, el.clientHeight); return r/(ctx.radiusKm*2.2)*ui.zoom; }
function proj(p){ const s=pxPerKm();
  const x=(p.lng-ctx.origin.lng)*88.2*s, y=-(p.lat-ctx.origin.lat)*111*s; return {x,y}; }
function bgSVG(){
  // 장식용 가짜 지도 (실제 구현: 카카오/네이버 지도 SDK로 교체)
  const rnd = (i)=>((hash('r'+i)%1000)/1000);
  let roads='';
  for(let i=0;i<26;i++){ const v=-2000+i*160+rnd(i)*60;
    roads+=`<line x1="${v}" y1="-2000" x2="${v+rnd(i+50)*300-150}" y2="2000" stroke="#1d1d1d" stroke-width="${i%5===0?9:3}"/>`;
    roads+=`<line x1="-2000" y1="${v}" x2="2000" y2="${v+rnd(i+90)*300-150}" stroke="#1d1d1d" stroke-width="${i%6===0?9:3}"/>`; }
  let parks='';
  for(let i=0;i<14;i++) parks+=`<rect x="${rnd(i+7)*3600-1800}" y="${rnd(i+19)*3600-1800}" width="${60+rnd(i+3)*140}" height="${50+rnd(i+5)*120}" rx="24" fill="#161616"/>`;
  return `<svg class="bg" viewBox="-2000 -2000 4000 4000" xmlns="http://www.w3.org/2000/svg">
    ${parks}${roads}
    <path d="M-2000 -260 C -1200 -420, -700 -40, -150 -200 S 700 -520, 1200 -300 S 1800 -160, 2000 -260" stroke="#2a0e12" stroke-width="70" fill="none"/>
  </svg>`;
}
function renderMap(loading){

  let html = bgSVG();
  html += `<div class="me" style="left:0;top:0"></div><div class="me-label" style="left:0;top:0">출발</div>`;
  if (!loading && res && !res.error){

      html += `<button class="pin ${i<3?'top':''} ${ctx.selectedTheaterId===c.t.id?'sel':''}" style="left:${p.x}px;top:${p.y}px" data-tid="${c.t.id}"
        aria-label="${i+1}위 ${esc(c.t.name)}, ${hm(c.rep.start)} 상영"><span class="rk">${pad(i+1)}</span>${hm(c.rep.start)}</button>`; });
    res.unknown.forEach(c=>{ const p=proj(c.t);
      html += `<button class="pin unk ${ctx.selectedTheaterId===c.t.id?'sel':''}" style="left:${p.x}px;top:${p.y}px" data-tid="${c.t.id}" aria-label="${esc(c.t.name)}, 이동시간 확인 불가"><span class="rk">?</span>확인 불가</button>`; });

  w.innerHTML = html;

  const top = $('.topbar').offsetHeight + 16;
  $('#mapTools').style.top = top+'px';
  $('#research').style.top = ($('.topbar').offsetHeight + 2)+'px';   // 요약 바 바로 아래
}
function applyPan(){ $('#world').style.transform = `translate(${ui.pan.x}px,${ui.pan.y}px)`; }
function centerOn(t){

// drag-to-pan
(()=>{ const map=$('#map'); let st=null;
  map.addEventListener('pointerdown', e=>{ if(e.target.closest('.pin')) return; st={x:e.clientX,y:e.clientY,px:ui.pan.x,py:ui.pan.y,moved:false}; map.setPointerCapture(e.pointerId); });
  map.addEventListener('pointermove', e=>{ if(!st) return; const dx=e.clientX-st.x, dy=e.clientY-st.y;

      <p>${c.t.brand} · ${esc(c.t.addr)}</p></div></div>
    ${c.travel==null
      ? `<div class="notice warn">이동시간을 확인하지 못했어요. 관람 가능 여부를 판단할 수 없어요. <button class="btn sm ghost" onclick="toast('데모: 경로 재조회')">재시도</button></div>`
      : `<div class="travel-box"><div><small>${MODE[ctx.transportMode].nm}</small><b>${c.travel}분</b></div>
         <div><small>예상 입장</small><b>${hm(c.entryAt)}</b></div><div><small>거리</small><b>${c.dist.toFixed(1)}km</b></div></div>
         <p class="ms" style="margin:4px 4px 0">입장 소요 ${ENTRY_MIN}분 포함 · 예상값</p>`}
    <div class="section-t shows-t">${esc(m.title)} · 오늘 상영회차</div>
    <div class="shows" role="group" aria-label="상영회차">
      ${shows.map(s=>`<button class="showtime" data-sid="${s.id}" aria-pressed="${s.id===ctx.selectedShowtimeId}" ${s.ok===false?'disabled':''}>
        <b>${hm(s.start)}</b> <span class="f">~${hm(addMin(s.start,m.runtime))}</span>
        <div class="why">${s.ok===true?`<span style="color:var(--ok)">${I('check')} ${s.slack}분 여유</span>`:s.why}</div></button>`).join('')}
    </div>
    ${sel ? `<div class="pick-sum"><b>${hm(sel.start)} 회차 선택</b><br>
       ${sel.ok ? `${hm(c.entryAt)} 입장 예상 → 상영 <b>${sel.slack}분 전</b> 도착` : '도착 가능 여부를 확인할 수 없어요'}
       ${sel.ok?`<br><span class="ms">늦어도 <b>${hm(addMin(ui.results.departAt, sel.slack-ctx.arrivalBufferMinutes))}</b>에는 출발하세요</span>`:''}</div>` : ''}
    <p class="ms" style="margin:12px 4px">상영시간표는 바뀔 수 있어요. 예매 페이지 정보가 최종 기준이에요.</p>
    <div class="detail-cta">
      <button class="btn soft-red" id="dDir">${I('route')} 길찾기</button>
      <button class="btn primary" id="dBook" ${sel?'':'disabled'}>${I('ticket')} 예매하기</button>
    </div></div>`;
  $('#dBack').onclick = closeDetail;
  box.querySelector('.shows').onclick = e=>{ const b=e.target.closest('.showtime'); if(!b||b.disabled) return; ctx.selectedShowtimeId=b.dataset.sid; renderDetail(); };
  $('#dDir').onclick = ()=>confirmOut('길찾기로 이동',
    `카카오맵에서 <b>${esc(c.t.name)}</b>까지 길찾기를 엽니다.`,
    `https://map.kakao.com/link/to/${encodeURIComponent(c.t.name)},${c.t.lat},${c.t.lng}`);
  $('#dBook').onclick = ()=>confirmOut(`${c.t.brand} 공식 예매로 이동`,
    `${c.t.brand} 공식 예매 페이지로 이동합니다.<br>회차 정보가 자동으로 넘어가지 않으면 <b>${hm(sel.start)}</b> 회차를 다시 선택해 주세요.`,
    BRANDS[c.t.brand].url);
}
function confirmOut(title, body, url){
  $('#mTitle').textContent=title; $('#mBody').innerHTML=body; $('#modal').classList.add('show'); $('#mOk').focus();
  $('#mOk').onclick=()=>{ window.open(url,'_blank','noopener'); $('#modal').classList.remove('show'); };
}
$('#mCancel').onclick = ()=>$('#modal').classList.remove('show');
document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ if($('#modal').classList.contains('show')) $('#modal').classList.remove('show'); else if(ctx.selectedTheaterId && $('#s03').classList.contains('active')) closeDetail(); }});

/* ---- sheet + nav ---- */
function setSheet(s){ ui.sheet=s; const el=$('#sheet'); el.classList.toggle('expanded',s==='full'); el.classList.toggle('peek',s==='peek'); }
$('#handle').onclick = ()=>setSheet({peek:'mid',mid:'full',full:'peek'}[ui.sheet]);
$('#toS02').onclick = ()=>{ renderS02(); go('s02'); };
$('#sumEdit').onclick = $('#toS02').onclick;
$('#sumEdit').onkeydown = e=>{ if(e.key==='Enter') $('#toS02').onclick(); };
$('#changeMovie').onclick = ()=>go('s01');
$('#scenario').onchange = ()=>{ if($('#s03').classList.contains('active')) search(); else ui.dirty=true; };
addEventListener('resize', ()=>{ if($('#s03').classList.contains('active')) renderMap(); });

// 스플래시: 1.5초 보여주고 영화 선택으로 (누르면 바로 넘어감)
(()=>{
  const sp = $('#s00');
  let done = false;
  const next = () => { if (done) return; done = true; sp.classList.add('out'); setTimeout(()=>go('s01'), 600); };
  setTimeout(next, 1500);
  sp.addEventListener('click', next);
})();
renderMovies();
</script>
</body>
</html>
